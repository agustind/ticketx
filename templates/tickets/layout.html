<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tickets{% endblock %} · ticketex</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        {% raw %}
        :root {
            --bg: #fbfaf8;
            --fg: #14181e;
            --muted: #5e626a;
            --card: #ffffff;
            --border: rgba(20, 24, 30, .12);
            --accent: #6d4fe3;
            --danger: #c2362b;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14181e;
                --fg: #e6e8eb;
                --muted: #9aa0a8;
                --card: #1c2128;
                --border: #232a33;
                --accent: #9c82f2;
                --danger: #f2877e;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }

        .wrap { max-width: 48rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
        h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.02em; }
        a { color: var(--accent); }
        .muted { color: var(--muted); }

        .btn {
            display: inline-block; padding: .45rem .9rem; border-radius: .5rem; border: 1px solid var(--accent);
            background: var(--accent); color: #fff; font: inherit; font-size: .9rem; text-decoration: none; cursor: pointer;
        }
        .btn.ghost { background: transparent; color: var(--accent); }
        .btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: .75rem; padding: 1.25rem; }
        ul.list { list-style: none; margin: 0; padding: 0; }
        ul.list li { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .75rem 0; border-bottom: 1px solid var(--border); }
        ul.list li:last-child { border-bottom: 0; }

        .status { font-size: .75rem; padding: .1rem .55rem; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
        .status.open { color: var(--accent); border-color: var(--accent); }

        label { display: block; font-weight: 600; margin: 1rem 0 .3rem; }
        input, textarea, select {
            width: 100%; padding: .55rem .7rem; border-radius: .5rem; border: 1px solid var(--border);
            background: var(--bg); color: var(--fg); font: inherit;
        }
        textarea { min-height: 8rem; }
        .error { color: var(--danger); font-size: .85rem; margin: .25rem 0 0; }
        .actions { display: flex; gap: .5rem; margin-top: 1.25rem; flex-wrap: wrap; }
        .actions form { margin: 0; }
        {% endraw %}
    </style>
</head>

<body>
    <div class="wrap">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
