services:
  app:
    build: .
    command: python craft serve --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes: [".:/app"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://masonite:secret@db:5432/masonite
    depends_on: [db]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: masonite
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: masonite
    volumes: ["pgdata:/var/lib/postgresql/data"]

volumes:
  pgdata: